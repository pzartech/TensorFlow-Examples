name: didit-audit CI

on:
  push:
    paths:
      - 'didit-audit/**'
      - '.github/workflows/didit-audit-ci.yml'
  pull_request:
    paths:
      - 'didit-audit/**'
      - '.github/workflows/didit-audit-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: didit-audit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ici_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ici_test
      DIDIT_WEBHOOK_SECRET: test-secret
      # KYC and blockchain stay OFF in CI — we test everything else.
      OTS_DISABLED: '1'
      FS_SINKS: /tmp/audit-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm run test:e2e
        env:
          FS_SINKS: /tmp/audit-e2e
      - run: npm run test:erasure
        env:
          FS_SINKS: /tmp/audit-erasure
          # Test-only key (base64 of 32 bytes); real key lives in HSM/KMS.
          REPLICA_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - name: eIDAS chain validation
        run: |
          T=$(mktemp -d)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$T/ca.key" -out "$T/ca.pem" -days 3650 -subj "/CN=Test QTSP Root" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl ecparam -name prime256v1 -genkey -noout -out "$T/leaf.key"
          openssl req -new -key "$T/leaf.key" -out "$T/leaf.csr" -subj "/CN=Test TSA"
          openssl x509 -req -in "$T/leaf.csr" -CA "$T/ca.pem" -CAkey "$T/ca.key" -CAcreateserial -out "$T/leaf.pem" -days 3650
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$T/other.key" -out "$T/other.pem" -days 3650 -subj "/CN=Other Root" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          CA_PEM="$T/ca.pem" LEAF_PEM="$T/leaf.pem" OTHER_PEM="$T/other.pem" npm run test:eidas
